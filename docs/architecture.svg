<svg xmlns="http://www.w3.org/2000/svg" width="880" height="760" viewBox="0 0 880 760" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>quik-bridge architecture</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/>
    </marker>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1f2328; text-anchor: middle; }
      .s  { font-size: 12px; fill: #424a53; text-anchor: middle; }
      .lbl { font-size: 12px; font-weight: 600; fill: #7d8590; }
      .edge { stroke: #7d8590; stroke-width: 1.6; fill: none; }
      .zone { fill: none; stroke: #7d8590; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .app  { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.5; }
      .sub  { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1.5; }
      .api  { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; }
      .up   { fill: #fbefff; stroke: #c297ff; stroke-width: 1.5; }
      .ven  { fill: #ffebe9; stroke: #ff8182; stroke-width: 1.5; }
      .fake { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <!-- zones -->
  <rect class="zone" x="20" y="20" width="840" height="470" rx="12"/>
  <text class="lbl" x="34" y="40">JVM: io.github.soloyes.quikbridge (fork)</text>
  <rect class="zone" x="20" y="515" width="560" height="225" rx="12"/>
  <text class="lbl" x="34" y="535">Windows host</text>

  <!-- row 1: app -->
  <rect class="app" x="300" y="52" width="280" height="54" rx="8"/>
  <text class="t" x="440" y="75">QuikBridgeApp / QuikBridge</text>
  <text class="s" x="440" y="94">config → plan → start → shutdown hook</text>

  <!-- row 2: bus -->
  <rect class="app" x="200" y="138" width="480" height="48" rx="8"/>
  <text class="t" x="440" y="159">SimpleEventBus</text>
  <text class="s" x="440" y="177">thread-safe, routes events by supports()</text>

  <!-- row 3: subscribers -->
  <rect class="sub" x="75" y="222" width="180" height="62" rx="8"/>
  <text class="t" x="165" y="247">ConnectionSubscriber</text>
  <text class="s" x="165" y="266">connect loop, state machine</text>
  <rect class="sub" x="270" y="222" width="180" height="62" rx="8"/>
  <text class="t" x="360" y="247">CallbackSubscriber</text>
  <text class="s" x="360" y="266">connection status callback</text>
  <rect class="sub" x="465" y="222" width="180" height="62" rx="8"/>
  <text class="t" x="555" y="247">OrderSubscriber</text>
  <text class="s" x="555" y="266">orders &amp; trades subscription</text>
  <rect class="sub" x="660" y="222" width="180" height="62" rx="8"/>
  <text class="t" x="750" y="247">Your subscriber</text>
  <text class="s" x="750" y="266">OrderTradeLogger, DB, strategy</text>

  <!-- row 4: connector + api -->
  <rect class="api" x="75" y="320" width="220" height="52" rx="8"/>
  <text class="t" x="185" y="342">Connector + Heartbeat</text>
  <text class="s" x="185" y="360">retry, decide, poll status</text>
  <rect class="api" x="330" y="320" width="300" height="52" rx="8"/>
  <text class="t" x="480" y="342">QuikApi (interface)</text>
  <text class="s" x="480" y="360">TRANS2QUIK_* in plain Java types</text>
  <rect class="fake" x="665" y="320" width="175" height="52" rx="8"/>
  <text class="t" x="752" y="342">FakeQuikApi</text>
  <text class="s" x="752" y="360">JUnit tests, no DLL</text>

  <!-- row 5: jna -->
  <rect class="api" x="150" y="408" width="260" height="58" rx="8"/>
  <text class="t" x="280" y="432">JnaQuikApi</text>
  <text class="s" x="280" y="451">keeps callbacks alive, cp1251</text>
  <rect class="up" x="440" y="408" width="300" height="58" rx="8"/>
  <text class="t" x="590" y="432">org.jtrans2quik wrapper</text>
  <text class="s" x="590" y="451">JNA interface, upstream by Enfernuz</text>

  <!-- native -->
  <rect class="ven" x="170" y="550" width="280" height="54" rx="8"/>
  <text class="t" x="310" y="573">TRANS2QUIK.dll</text>
  <text class="s" x="310" y="592">ARQA, ships with QUIK</text>
  <rect class="ven" x="170" y="660" width="280" height="54" rx="8"/>
  <text class="t" x="310" y="683">QUIK terminal (info.exe)</text>
  <text class="s" x="310" y="702">external transactions enabled</text>
  <rect class="ven" x="640" y="660" width="200" height="54" rx="8"/>
  <text class="t" x="740" y="683">Broker's QUIK server</text>
  <text class="s" x="740" y="702">exchange access</text>

  <!-- edges: commands down -->
  <path class="edge" marker-end="url(#arr)" d="M440,106 V136"/>
  <path class="edge" marker-end="url(#arr)" d="M300,186 L180,220"/>
  <path class="edge" marker-end="url(#arr)" d="M390,186 L365,220"/>
  <path class="edge" marker-end="url(#arr)" d="M490,186 L545,220"/>
  <path class="edge" marker-end="url(#arr)" d="M580,186 L735,220"/>
  <path class="edge" marker-end="url(#arr)" d="M165,284 V318"/>
  <path class="edge" marker-end="url(#arr)" d="M295,346 H328"/>
  <path class="edge" marker-end="url(#arr)" d="M380,284 L430,318"/>
  <path class="edge" marker-end="url(#arr)" d="M545,284 L520,318"/>
  <path class="edge" stroke-dasharray="5 4" marker-end="url(#arr)" d="M630,346 H663"/>
  <text class="lbl" x="633" y="338">tests</text>
  <path class="edge" marker-end="url(#arr)" d="M420,372 L320,406"/>
  <path class="edge" marker-end="url(#arr)" d="M410,437 H438"/>
  <path class="edge" marker-end="url(#arr)" d="M560,466 L400,548"/>
  <text class="lbl" x="492" y="507">JNA calls</text>
  <path class="edge" marker-start="url(#arr)" marker-end="url(#arr)" d="M310,606 V658"/>
  <text class="lbl" x="320" y="637">local connection</text>
  <path class="edge" marker-start="url(#arr)" marker-end="url(#arr)" d="M452,687 H638"/>
  <text class="lbl" x="500" y="679">network</text>

  <!-- callbacks back up -->
  <path class="edge" stroke-dasharray="6 4" marker-end="url(#arr)" d="M170,577 H45 V162 H198"/>
  <text class="lbl" transform="translate(36,470) rotate(-90)">callbacks → events: connection status, orders, trades</text>
</svg>
