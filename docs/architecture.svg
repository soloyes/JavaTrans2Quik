<svg xmlns="http://www.w3.org/2000/svg" width="880" height="850" viewBox="0 0 880 850" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>quik-bridge architecture</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 Z" fill="#7d8590"/>
    </marker>
    <style>
      .t    { font-size: 15px; font-weight: 600; fill: #1f2328; text-anchor: middle; }
      .s    { font-size: 12px; fill: #424a53; text-anchor: middle; }
      .zl   { font-size: 12px; font-weight: 600; fill: #7d8590; }
      .lbl  { font-size: 12px; font-weight: 600; fill: #57606a; text-anchor: middle; }
      .lbl2 { font-size: 12px; fill: #57606a; text-anchor: middle; }
      .pill { fill: #eaeef2; }
      .edge { stroke: #7d8590; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 6 4; }
      .zone { fill: none; stroke: #7d8590; stroke-width: 1.2; stroke-dasharray: 6 5; }
      .app  { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1.5; }
      .sub  { fill: #dafbe1; stroke: #4ac26b; stroke-width: 1.5; }
      .api  { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.5; }
      .up   { fill: #fbefff; stroke: #c297ff; stroke-width: 1.5; }
      .ven  { fill: #ffebe9; stroke: #ff8182; stroke-width: 1.5; }
      .sim  { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <!-- zones -->
  <rect class="zone" x="20" y="20" width="840" height="548" rx="12"/>
  <text class="zl" x="34" y="41">JVM: io.github.soloyes.quikbridge (fork)</text>
  <rect class="zone" x="310" y="596" width="300" height="236" rx="12"/>
  <text class="zl" x="324" y="617">Windows host</text>

  <!-- edges (drawn first, boxes and labels cover them where needed) -->
  <g id="edges">
    <path class="edge" marker-end="url(#arr)" d="M458,106 V138"/>
    <path class="edge" marker-end="url(#arr)" d="M165,186 V222"/>
    <path class="edge" marker-end="url(#arr)" d="M360,186 V222"/>
    <path class="edge" marker-end="url(#arr)" d="M555,186 V222"/>
    <path class="edge" marker-end="url(#arr)" d="M750,186 V222"/>
    <path class="edge" marker-end="url(#arr)" d="M165,284 V320"/>
    <path class="edge" marker-end="url(#arr)" d="M360,284 V320"/>
    <path class="edge" marker-end="url(#arr)" d="M555,284 V320"/>
    <path class="edge" marker-end="url(#arr)" d="M295,346 H330"/>
    <path class="edge dash" marker-end="url(#arr)" d="M590,346 H650"/>
    <path class="edge" marker-end="url(#arr)" d="M460,372 V404"/>
    <path class="edge" marker-end="url(#arr)" d="M460,456 V488"/>
    <path class="edge" marker-end="url(#arr)" d="M460,540 V632"/>
    <path class="edge" marker-start="url(#arr)" marker-end="url(#arr)" d="M460,686 V752"/>
    <path class="edge" marker-start="url(#arr)" marker-end="url(#arr)" d="M590,779 H680"/>
    <!-- callbacks from the DLL back into the bus -->
    <path class="edge dash" marker-end="url(#arr)" d="M330,659 H55 Q45,659 45,649 V172 Q45,162 55,162 H75"/>
  </g>

  <!-- row 1: app -->
  <rect class="app" x="318" y="52" width="280" height="54" rx="8"/>
  <text class="t" x="458" y="75">QuikBridgeApp / QuikBridge</text>
  <text class="s" x="458" y="94">config → plan → start → shutdown hook</text>

  <!-- row 2: bus -->
  <rect class="app" x="75" y="138" width="765" height="48" rx="8"/>
  <text class="t" x="458" y="159">SimpleEventBus</text>
  <text class="s" x="458" y="177">thread-safe, routes events by supports()</text>

  <!-- row 3: subscribers -->
  <rect class="sub" x="75" y="222" width="180" height="62" rx="8"/>
  <text class="t" x="165" y="247">ConnectionSubscriber</text>
  <text class="s" x="165" y="266">connect loop, state machine</text>
  <rect class="sub" x="270" y="222" width="180" height="62" rx="8"/>
  <text class="t" x="360" y="247">CallbackSubscriber</text>
  <text class="s" x="360" y="266">connection status callback</text>
  <rect class="sub" x="465" y="222" width="180" height="62" rx="8"/>
  <text class="t" x="555" y="247">OrderSubscriber</text>
  <text class="s" x="555" y="266">orders and trades subscription</text>
  <rect class="sub" x="660" y="222" width="180" height="62" rx="8"/>
  <text class="t" x="750" y="247">Your subscriber</text>
  <text class="s" x="750" y="266">OrderTradeLogger, DB, strategy</text>

  <!-- row 4: connector + api -->
  <rect class="api" x="75" y="320" width="220" height="52" rx="8"/>
  <text class="t" x="185" y="342">Connector + Heartbeat</text>
  <text class="s" x="185" y="360">retry, decide, poll status</text>
  <rect class="api" x="330" y="320" width="260" height="52" rx="8"/>
  <text class="t" x="460" y="342">QuikApi (interface)</text>
  <text class="s" x="460" y="360">TRANS2QUIK_* in plain Java types</text>
  <rect class="sim" x="650" y="320" width="190" height="52" rx="8"/>
  <text class="t" x="745" y="342">SimulatedQuikApi</text>
  <text class="s" x="745" y="360">tests and --demo, no DLL</text>

  <!-- row 5: jna + wrapper -->
  <rect class="api" x="330" y="404" width="260" height="52" rx="8"/>
  <text class="t" x="460" y="426">JnaQuikApi</text>
  <text class="s" x="460" y="444">keeps callbacks alive, cp1251</text>
  <rect class="up" x="330" y="488" width="260" height="52" rx="8"/>
  <text class="t" x="460" y="510">org.jtrans2quik wrapper</text>
  <text class="s" x="460" y="528">JNA interface, upstream by Enfernuz</text>

  <!-- native side -->
  <rect class="ven" x="330" y="632" width="260" height="54" rx="8"/>
  <text class="t" x="460" y="655">TRANS2QUIK.dll</text>
  <text class="s" x="460" y="674">ARQA, ships with QUIK</text>
  <rect class="ven" x="330" y="752" width="260" height="54" rx="8"/>
  <text class="t" x="460" y="775">QUIK terminal (info.exe)</text>
  <text class="s" x="460" y="794">external transactions enabled</text>
  <rect class="ven" x="680" y="752" width="180" height="54" rx="8"/>
  <text class="t" x="770" y="775">Broker's QUIK server</text>
  <text class="s" x="770" y="794">exchange access</text>

  <!-- edge labels -->
  <g class="lab">
    <rect class="pill" data-on="1" x="424" y="573" width="72" height="18" rx="9"/>
    <text class="lbl" x="460" y="586">JNA calls</text>
  </g>
  <g class="lab">
    <rect class="pill" x="472" y="710" width="114" height="18" rx="9"/>
    <text class="lbl" x="529" y="723">local connection</text>
  </g>
  <g class="lab">
    <rect class="pill" x="616" y="754" width="58" height="18" rx="9"/>
    <text class="lbl" x="645" y="767">network</text>
  </g>
  <g class="lab">
    <rect class="pill" data-on="1" x="30" y="420" width="232" height="40" rx="9"/>
    <text class="lbl" x="152" y="437">callbacks → events</text>
    <text class="lbl2" x="152" y="454">connection status, orders, trades</text>
  </g>
</svg>
