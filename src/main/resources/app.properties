# Timeout in milliseconds for main program. It empty => infinite run
main.thread.timeout=20000

# Heartbeat timeout. For connection purpose.
heartbeat.thread.timeout=1000

# Path to QUIK application
path.to.quick="C:\\SBERBANK\\QUIK\\"

# Whether to subscribe to all available classes.
# If set true, then check order.book.subscribe.all.sec.codes
# If set false, then skip order.book.subscribe.all.sec.codes and check order.book.subscription.name
order.book.subscribe.all.class.codes=false

# Whether to subscribe to particular codes.
# If set true, then skip order.book.sec.codes and subscribe to everything available.
# If set false, then check order.book.sec.codes
order.book.subscribe.all.sec.codes=false

# List of particular codes when particular class is not set. If empty, then subscribe to everything (same as order.book.subscribe.all.sec.codes=true)
order.book.sec.codes=LKOH

# Human readable list of asset classes. It is allowed to name subscription bundle as comfortable. But order.book.class.code and order.book.sec.codes has to be ended with bucket name.
# Empty and same strings will be merged.
order.book.subscription.name=oil,metals

# Class code. From documentation class code should be given as single word or empty. If not empty, then checking order.book.sec.codes.{code}
order.book.class.code.oil=class1
order.book.class.code.metals=class2

# Sec codes. A number of instruments, divided by comma.
order.book.sec.codes.oil=LKOH,GAZP
order.book.sec.codes.metals=POLY